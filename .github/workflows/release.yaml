name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require exact stable version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/prune_releases.py validate-tag "$RELEASE_TAG"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yaml

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native libpcap toolchain
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev gcc
      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make build VERSION="${RELEASE_TAG#v}"
          ./build/n-udptee version
          package="n-udptee_${RELEASE_TAG}_linux_${ARCH}"
          mkdir -p "build/${package}/configs" "build/${package}/deploy/systemd" dist
          cp build/n-udptee README.md README.pt-BR.md "build/${package}/"
          cp configs/example.yaml "build/${package}/configs/"
          cp deploy/systemd/n-udptee.service "build/${package}/deploy/systemd/"
          tar -C build -czf "dist/${package}.tar.gz" "${package}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-linux-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          test -s "n-udptee_${RELEASE_TAG}_linux_amd64.tar.gz"
          test -s "n-udptee_${RELEASE_TAG}_linux_arm64.tar.gz"
          sha256sum ./*.tar.gz > SHA256SUMS
      - name: Publish complete release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,assets > /tmp/release.json; then
            if ! python3 -c 'import json; import sys; sys.exit(0 if json.load(open("/tmp/release.json"))["isDraft"] else 1)'; then
              python3 - <<'PY'
          import json
          from pathlib import Path
          existing = {asset['name'] for asset in json.load(open('/tmp/release.json'))['assets']}
          expected = {path.name for path in Path('dist').iterdir() if path.is_file()}
          if not expected <= existing:
              raise SystemExit('Published release is missing expected assets; refusing to overwrite it')
          PY
              echo "Release already published with expected assets"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Keep the five latest published stable releases
        run: python3 .github/scripts/prune_releases.py prune --repo "$GH_REPO" --keep 5
